name: Release

# Тег vX.Y.Z (равный NetBenchVersion в NetBench/Directory.Build.props) собирает всё и выкладывает
# в бета-каналы: IPA → TestFlight, AAB → внутреннее тестирование Play (черновиком, пока приложение
# не опубликовано), тексты и скриншоты — в оба стора (без отправки на ревью), desktop-установщики —
# в черновик GitHub Release. Production и отправка на ревью — вручную в консолях (store/README.md).
# Ручной запуск — та же цепочка для текущей версии, с выбором платформ.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      ios:
        description: iOS → TestFlight + App Store metadata
        type: boolean
        default: true
      android:
        description: Android → Play internal + Play listing
        type: boolean
        default: true
      desktop:
        description: Desktop installers → GitHub Release (draft)
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          version=$(sed -n 's:.*<NetBenchVersion>\(.*\)</NetBenchVersion>.*:\1:p' NetBench/Directory.Build.props)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match NetBenchVersion $version"
            exit 1
          fi

      # Черновик релиза создаём здесь, один раз: desktop-джобы матрицы дописывают в него свои файлы
      # (vpk upload --merge находит релиз по имени), а не создают параллельно несколько черновиков.
      - name: Draft GitHub Release
        if: github.event_name == 'push' || inputs.desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          scripts/release-notes.sh "$VERSION" > "$RUNNER_TEMP/notes.md"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION already exists"
          else
            gh release create "v$VERSION" --draft --title "NetBench $VERSION" \
              --notes-file "$RUNNER_TEMP/notes.md" --target "$GITHUB_SHA"
          fi

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Store text limits
        run: bundle exec fastlane check

  ios:
    needs: version
    if: github.event_name == 'push' || inputs.ios
    runs-on: macos-26
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
      IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64 IOS_DIST_CERT_P12_BASE64 IOS_DIST_CERT_PASSWORD; do
            [[ -n "${!name}" ]] || { echo "::error::Secret $name is not set (store/README.md)"; exit 1; }
          done

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install iOS workload
        run: dotnet workload install ios

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: IPA → TestFlight
        run: bundle exec fastlane ios beta

      - name: Metadata and screenshots → App Store Connect
        run: bundle exec fastlane ios metadata

      - uses: actions/upload-artifact@v4
        with:
          name: netbench-ios-ipa
          path: NetBench/NetBench.iOS/bin/Release/net10.0-ios/ios-arm64/publish/*.ipa
          if-no-files-found: error

  android:
    needs: version
    if: github.event_name == 'push' || inputs.android
    runs-on: ubuntu-latest
    env:
      PLAY_JSON_KEY: ${{ secrets.PLAY_JSON_KEY }}
      NETBENCH_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      NETBENCH_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      NETBENCH_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      # draft, пока в Play нет опубликованного релиза; потом — переменная репозитория completed
      PLAY_RELEASE_STATUS: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check secrets
        run: |
          for name in PLAY_JSON_KEY NETBENCH_KEYSTORE_BASE64 NETBENCH_KEY_ALIAS NETBENCH_KEYSTORE_PASSWORD; do
            [[ -n "${!name}" ]] || { echo "::error::Secret for $name is not set (store/README.md)"; exit 1; }
          done

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Android workload
        run: dotnet workload install android

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: AAB → Play internal testing
        run: bundle exec fastlane android internal

      - name: Listing and screenshots → Google Play
        run: bundle exec fastlane android metadata

      - uses: actions/upload-artifact@v4
        with:
          name: netbench-android-aab
          path: NetBench/NetBench.Android/bin/Release/net10.0-android/publish/*-Signed.aab
          if-no-files-found: error

  desktop:
    needs: version
    if: github.event_name == 'push' || inputs.desktop
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: osx-arm64
            os: macos-26
          - rid: osx-x64
            os: macos-26
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.version.outputs.version }}
      VPK_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Подпись Developer ID и нотаризация: p12 с «Developer ID Application» (и, если есть, «Developer ID
      # Installer» — тогда собирается и .pkg) во временную связку ключей; нотаризация — тем же ключом
      # App Store Connect API, что и для сторов. Без секретов macOS-сборка выходит неподписанной.
      - name: Import Developer ID certificates
        if: runner.os == 'macOS'
        env:
          P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          if [[ -z "$P12_BASE64" ]]; then
            echo "::warning::MACOS_DEVELOPER_ID_P12_BASE64 is not set — the macOS build is unsigned"
            exit 0
          fi
          keychain="$RUNNER_TEMP/netbench-signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          # shellcheck disable=SC2046 # список связок ключей — отдельными аргументами
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          echo "VPK_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

          identities="$(security find-identity -v "$keychain")"
          app=$(grep -o '"Developer ID Application: [^"]*"' <<< "$identities" | head -1 | tr -d '"')
          installer=$(grep -o '"Developer ID Installer: [^"]*"' <<< "$identities" | head -1 | tr -d '"')
          echo "MACOS_SIGN_APP_IDENTITY=$app" >> "$GITHUB_ENV"
          [[ -n "$installer" ]] && echo "MACOS_SIGN_INSTALL_IDENTITY=$installer" >> "$GITHUB_ENV"

          if [[ -n "$ASC_KEY_P8_BASE64" ]]; then
            echo "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
            xcrun notarytool store-credentials netbench-notary --key "$RUNNER_TEMP/AuthKey.p8" \
              --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID" --keychain "$keychain"
            echo "MACOS_NOTARY_PROFILE=netbench-notary" >> "$GITHUB_ENV"
          else
            echo "::warning::ASC_KEY_P8_BASE64 is not set — the macOS build is signed but not notarized"
          fi

      - name: Pack
        run: scripts/pack-desktop.sh ${{ matrix.rid }}

      - name: Upload to GitHub Release (draft)
        run: >-
          dotnet vpk upload github --repoUrl "${{ github.server_url }}/${{ github.repository }}"
          --token "${{ secrets.GITHUB_TOKEN }}" --outputDir "artifacts/desktop/${{ matrix.rid }}/releases"
          --channel ${{ matrix.rid }} --tag "v$VERSION" --releaseName "NetBench $VERSION" --merge

      - uses: actions/upload-artifact@v4
        with:
          name: netbench-desktop-${{ matrix.rid }}
          path: artifacts/desktop/${{ matrix.rid }}/releases/*
          if-no-files-found: error
