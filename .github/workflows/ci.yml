name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Общий проект мультитаргетный (net10.0 + android/ios); на runner'е без
      # мобильных workloads отключаем мобильные таргеты флагом MobileTargets=false.
      - name: Build (Desktop)
        run: dotnet build NetBench/NetBench.Desktop/NetBench.Desktop.csproj -c Release -p:MobileTargets=false

      - name: Test
        run: dotnet test NetBench/NetBench.Tests/NetBench.Tests.csproj -c Release -p:MobileTargets=false

      # Мобильная (Plumix) презентация в headless-окне: исходники компилируются под net10.0,
      # мобильные workloads не нужны.
      - name: Test (Mobile UI, headless)
        run: dotnet test NetBench/NetBench.Mobile.Tests/NetBench.Mobile.Tests.csproj -c Release

  build-mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Android workload
        run: dotnet workload install android

      # Проверяем Plumix-флейвор общего проекта; iOS-таргет на linux недоступен,
      # поэтому ограничиваем TargetFrameworks одним android.
      - name: Build (Mobile, android)
        run: dotnet build NetBench/NetBench/NetBench.csproj -c Release -p:TargetFrameworks=net10.0-android

  # Android-голова целиком, как для Google Play: Release AAB с versionCode из номера прогона.
  # Подписывается upload-ключом, если заданы секреты ANDROID_KEYSTORE_BASE64 / ANDROID_KEY_ALIAS /
  # ANDROID_KEYSTORE_PASSWORD (см. store/README.md), иначе — debug-ключом (только проверка сборки).
  build-android-release:
    runs-on: ubuntu-latest
    env:
      # На уровне job: в if шага видны только env job/workflow, а не env самого шага.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install Android workload
        run: dotnet workload install android

      - name: Restore upload key
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/netbench-upload.jks"
          echo "NETBENCH_KEYSTORE=$RUNNER_TEMP/netbench-upload.jks" >> "$GITHUB_ENV"

      - name: Publish AAB
        env:
          NETBENCH_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NETBENCH_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: >-
          dotnet publish NetBench/NetBench.Android/NetBench.Android.csproj -c Release
          -p:NetBenchBuildNumber=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: netbench-android-aab
          path: NetBench/NetBench.Android/bin/Release/net10.0-android/publish/*-Signed.aab
          if-no-files-found: error

  # iOS-флейвор общего проекта и голова — под симулятор, без подписи: проверка, что всё
  # собирается на macOS-раннере. Подписанный IPA для TestFlight — store/README.md.
  build-ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install iOS workload
        run: dotnet workload install ios

      - name: Build (iOS head, simulator)
        run: >-
          dotnet build NetBench/NetBench.iOS/NetBench.iOS.csproj -c Release -r iossimulator-arm64
          -p:NetBenchBuildNumber=${{ github.run_number }}
